name: icoziv

services:
  worker:
    image: ${ICOZIV_WORKER_IMAGE:-icoziv:latest}
    build:
      context: .
      target: worker
    init: true
    restart: unless-stopped
    volumes:
      - worker-state:/app/.wrangler/state
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const r = await fetch('http://127.0.0.1:8787/api/icons'); if (!r.ok || !(await r.json()).length) process.exit(1)"
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 12

  web:
    image: icoziv-web:latest
    build:
      context: .
      target: web
      args:
        NEXT_PUBLIC_BADGE_BASE_URL: ${ICOZIV_PUBLIC_URL:-http://localhost:8080}/badge-api
    ports:
      - '127.0.0.1:${ICOZIV_PORT:-8080}:8080'
    depends_on:
      worker:
        condition: service_healthy
        restart: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/healthz
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  worker-state:
